# ===================================================
# ANIME LIST APP - UYGULAMA AYARLARI
# ===================================================

# --- Sunucu Ayarları ---
server.port=8080

# --- MySQL Veritabanı Bağlantı Ayarları ---
# <--- DAYI BURAYI DOLDUR (!!!) - Kendi MySQL kullanıcı adı ve şifreni yaz
spring.datasource.url=jdbc:mysql://localhost:3306/anime_list_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

# --- JPA / Hibernate Ayarları ---
# update: Şema değişikliklerini uygular ama mevcut veriyi KORUR.
# Yeni sütun/tablo eklenirse ALTER TABLE atılır, kayıtlar silinmez.
# (İlk açılışta tablolar yoksa otomatik oluşturulur.)
spring.jpa.hibernate.ddl-auto=update
# SQL sorgularını konsolda göster (debug için)
spring.jpa.show-sql=true
# Üretilen SQL'i daha okunabilir formatla
spring.jpa.properties.hibernate.format_sql=true
# MySQL 8 dialect: Hibernate'in MySQL'e uygun SQL üretmesini sağlar
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- data.sql Başlangıç Verileri Ayarları ---
# Hibernate önce şemayı oluştursun, SONRA data.sql çalışsın diye:
spring.jpa.defer-datasource-initialization=true
# data.sql her başlatmada çalışsın (create modunda her seferinde sıfırlanacağı için sorunsuz)
spring.sql.init.mode=always

# --- Dosya Yükleme (Multipart) Ayarları ---
# Kapak görseli BLOB olarak tutulacağı için dosya boyutu sınırlarını artırıyoruz
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Thymeleaf Ayarları ---
# Geliştirme sırasında şablon önbelleğini kapat (değişiklikler anında görünsün)
spring.thymeleaf.cache=false
