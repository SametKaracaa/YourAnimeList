<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Kataloğu - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .navbar-admin {
            background: linear-gradient(135deg, rgba(127,29,29,0.95) 0%, rgba(153,27,27,0.9) 100%) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .anime-table {
            border-radius: 16px;
            overflow: hidden;
        }
        .anime-table thead th {
            background: #1e293b;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            font-weight: 700;
            border: none;
            padding: 1rem;
        }
        .anime-table tbody td {
            padding: 0.75rem 1rem;
            vertical-align: middle;
        }
        .anime-table tbody tr {
            transition: background .15s ease;
        }
        .anime-table tbody tr:hover {
            background: rgba(99,102,241,0.04);
        }
        .anime-thumb {
            width: 40px;
            height: 56px;
            object-fit: cover;
            border-radius: 6px;
            background: #1e293b;
        }
        .anime-thumb-placeholder {
            width: 40px;
            height: 56px;
            border-radius: 6px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 1rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-admin navbar-dark sticky-top">
    <div class="container py-2">
        <a class="navbar-brand fw-bold" th:href="@{/admin/panel}">🛡️ Admin Panel</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/kullanicilar}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-people me-1"></i>Kullanıcılar
            </a>
            <a th:href="@{/admin/animeler}" class="text-white text-decoration-none small fw-medium">
                <i class="bi bi-collection-play me-1"></i>Animeler
            </a>
            <a th:href="@{/anime/ekle}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-plus-circle me-1"></i>Yeni Anime
            </a>
            <span class="text-white-50 small">|</span>
            <a th:href="@{/anime/liste}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Kullanıcı Paneli
            </a>
            <form th:action="@{/cikis}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right"></i> Çıkış
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div th:if="${basariMesaji}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${basariMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${hataMesaji}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${hataMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-white mb-1">
                <i class="bi bi-database-fill me-2"></i>Anime Kataloğu
            </h4>
            <p class="text-white-50 small mb-0">
                Veritabanındaki tüm animeler.
                <span class="badge bg-secondary ms-1" th:text="${#lists.size(animeler)}">0</span> kayıt
            </p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/anime/ekle}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i> Yeni Anime Ekle
            </a>
            <a th:href="@{/admin/panel}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Panele Dön
            </a>
        </div>
    </div>
    <div class="card glass-panel border-0">
        <div class="table-responsive">
            <table class="table table-hover anime-table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Görsel</th>
                        <th>Anime Adı</th>
                        <th>Tür</th>
                        <th>Yıl</th>
                        <th>Stüdyo</th>
                        <th>Bölüm</th>
                        <th class="text-center">İşlem</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${animeler}">
                        <td>
                            <span class="fw-medium text-muted" th:text="${a.id}">#</span>
                        </td>
                        <td>
                            <img th:if="${a.kapakGorseli != null}"
                                 th:src="@{/anime/gorsel/{id}(id=${a.id})}"
                                 class="anime-thumb" alt="Kapak">
                            <div th:if="${a.kapakGorseli == null}" class="anime-thumb-placeholder">
                                <i class="bi bi-image"></i>
                            </div>
                        </td>
                        <td>
                            <span class="fw-semibold" th:text="${a.animeAdi}">İsim</span>
                        </td>
                        <td>
                            <span class="text-muted small" th:text="${a.tur ?: '—'}">Tür</span>
                        </td>
                        <td>
                            <span th:text="${a.yayinYili ?: '—'}">Yıl</span>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${a.studyo ?: '—'}">Stüdyo</span>
                        </td>
                        <td>
                            <span th:text="${a.toplamBolum ?: '?'}">?</span>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/admin/anime/sil/{id}(id=${a.id})}" method="post" class="m-0"
                                  onsubmit="return confirm('Bu animeyi ve ilişkili tüm liste kayıtlarını silmek istediğinize emin misiniz? Bu işlem geri alınamaz!');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Sil">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(animeler)}" class="card glass-panel border-0 mt-3">
        <div class="card-body text-center py-5">
            <div class="display-1 mb-2">🎬</div>
            <h5 class="mb-1">Katalogda anime yok</h5>
            <p class="text-muted">Henüz hiçbir anime eklenmemiş.</p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
