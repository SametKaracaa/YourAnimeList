<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourAnimeList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .anime-cover { aspect-ratio: 2/3; object-fit: cover; background:#1e293b; }
        .anime-card { transition: transform .15s ease, box-shadow .15s ease; }
        .anime-card:hover { transform: translateY(-4px); }
        .stat-card .stat-value { font-size: 1.75rem; font-weight: 700; }
        .badge-durum { font-size: .75rem; padding: .35rem .6rem; }
        .durum-WATCHING       { background:#3b82f6; }
        .durum-COMPLETED      { background:#10b981; }
        .durum-PLAN_TO_WATCH  { background:#6b7280; }
        .durum-ON_HOLD        { background:#f59e0b; }
        .durum-DROPPED        { background:#ef4444; }
    </style>
</head>
<body>
<nav class="navbar navbar-custom navbar-dark sticky-top">
    <div class="container py-2">
        <a class="navbar-brand fw-bold" th:href="@{/anime/liste}">🎌 YourAnimeList</a>
        <div class="d-flex align-items-center gap-3 text-white-50 small">
            <i class="bi bi-person-circle me-1"></i>
            <span class="me-1" th:text="${kullaniciAdi}">user</span>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/panel}"
               class="btn btn-sm btn-outline-warning">
                <i class="bi bi-shield-lock me-1"></i>Admin Panel
            </a>
            <form th:action="@{/cikis}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right"></i> Çıkış
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div th:if="${basariMesaji}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${basariMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${hataMesaji}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${hataMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card stat-card glass-panel border-0 h-100">
                <div class="card-body text-center">
                    <div class="text-muted small">Toplam</div>
                    <div class="stat-value" th:text="${toplamAnime}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card glass-panel border-0 h-100">
                <div class="card-body text-center">
                    <div class="text-muted small">İzleniyor</div>
                    <div class="stat-value text-primary" th:text="${izleniyor}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card glass-panel border-0 h-100">
                <div class="card-body text-center">
                    <div class="text-muted small">Tamamlandı</div>
                    <div class="stat-value text-success" th:text="${tamamlanan}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card glass-panel border-0 h-100">
                <div class="card-body text-center">
                    <div class="text-muted small">Ortalama Puan</div>
                    <div class="stat-value text-warning">
                        <i class="bi bi-star-fill" style="font-size:1.25rem"></i>
                        <span th:text="${ortalamaPuan}">0.0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card glass-panel border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/anime/liste}" method="get" class="row g-2 align-items-end">

                <div class="col-md-3">
                    <label class="form-label small fw-medium mb-1">İsim</label>
                    <input type="text" class="form-control form-control-sm"
                           name="isim" th:value="${aramaIsim}" placeholder="Anime adı...">
                </div>

                <div class="col-md-2">
                    <label class="form-label small fw-medium mb-1">Tür</label>
                    <input type="text" class="form-control form-control-sm" list="tur-list"
                           name="tur" th:value="${aramaTur}" placeholder="Aksiyon, Macera...">
                    <datalist id="tur-list">
                        <option th:each="t : ${turler}" th:value="${t}"></option>
                    </datalist>
                </div>

                <div class="col-md-2">
                    <label class="form-label small fw-medium mb-1">Stüdyo</label>
                    <input type="text" class="form-control form-control-sm" list="studyo-list"
                           name="studyo" th:value="${aramaStudyo}" placeholder="MAPPA...">
                    <datalist id="studyo-list">
                        <option th:each="s : ${studyolar}" th:value="${s}"></option>
                    </datalist>
                </div>

                <div class="col-md-2">
                    <label class="form-label small fw-medium mb-1">Yıl</label>
                    <select class="form-select form-select-sm" name="yilStr">
                        <option value="">Tümü</option>
                        <option th:each="y : ${yillar}"
                                th:value="${y}"
                                th:text="${y}"
                                th:selected="${aramaYil != null and aramaYil == y}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label small fw-medium mb-1">Durum</label>
                    <select class="form-select form-select-sm" name="durum">
                        <option value="">Tümü</option>
                        <option th:each="d : ${izlemeDurumlari}"
                                th:value="${d}"
                                th:text="${d.etiket}"
                                th:selected="${aramaDurum != null and aramaDurum == d}"></option>
                    </select>
                </div>

                <div class="col-md-1 d-flex gap-1">
                    <button class="btn btn-primary btn-sm w-100" type="submit" title="Ara">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/anime/liste}" class="btn btn-outline-secondary btn-sm" title="Temizle">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3 text-white">
        <h5 class="m-0">
            <i class="bi bi-collection-play me-1"></i>
            Listem
            <span class="badge bg-secondary ms-1" th:text="${#lists.size(liste)}">0</span>
        </h5>
        <div class="d-flex gap-2">
            <form th:action="@{/anime/liste}" method="get" class="m-0 d-flex align-items-center gap-1" id="sortForm">
                <input type="hidden" name="isim" th:value="${aramaIsim}">
                <input type="hidden" name="tur" th:value="${aramaTur}">
                <input type="hidden" name="studyo" th:value="${aramaStudyo}">
                <input type="hidden" name="yilStr" th:value="${aramaYil}">
                <input type="hidden" name="durum" th:value="${aramaDurum}">
                <input type="hidden" name="yon" id="sortYon" th:value="${aramaYon != null ? aramaYon : 'desc'}">
                
                <select name="siralama" class="form-select form-select-sm" onchange="document.getElementById('sortForm').submit()" style="min-width: 190px; cursor: pointer;">
                    <option value="eklenmeTarihi" th:selected="${aramaSiralama == null or aramaSiralama == 'eklenmeTarihi'}">Ekleme Tarihine Göre</option>
                    <option value="yayinYili" th:selected="${aramaSiralama == 'yayinYili'}">Çıkış Tarihine Göre</option>
                    <option value="puan" th:selected="${aramaSiralama == 'puan'}">Puana Göre</option>
                    <option value="animeAdi" th:selected="${aramaSiralama == 'animeAdi'}">İsme Göre</option>
                </select>
                <button type="button" class="btn btn-sm btn-outline-light" onclick="toggleSortDirection()" title="Sıralama Yönünü Çevir">
                    <i class="bi" th:classappend="${aramaYon == 'asc' ? 'bi-sort-up' : 'bi-sort-down'}"></i>
                </button>
            </form>
            <a th:href="@{/anime/ekle}" class="btn btn-primary btn-sm d-flex align-items-center">
                <i class="bi bi-plus-lg me-1"></i> Yeni Anime Ekle
            </a>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(liste)}" class="card glass-panel border-0">
        <div class="card-body text-center py-5">
            <div class="display-1 mb-2">📺</div>
            <h5 class="mb-1">Hiç anime yok</h5>
            <p class="text-muted mb-3">Filtreyi temizleyin ya da yeni bir anime ekleyin.</p>
            <a th:href="@{/anime/ekle}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> İlk Animeni Ekle
            </a>
        </div>
    </div>
    <div class="row g-3" th:unless="${#lists.isEmpty(liste)}">
        <div class="col-6 col-md-4 col-lg-3" th:each="ual : ${liste}">
            <div class="card anime-card glass-panel border-0 h-100">
                <img th:if="${ual.anime.kapakGorseli != null}"
                     th:src="@{/anime/gorsel/{id}(id=${ual.anime.id})}"
                     class="card-img-top anime-cover"
                     th:alt="${ual.anime.animeAdi}">
                <div th:if="${ual.anime.kapakGorseli == null}"
                     class="anime-cover d-flex align-items-center justify-content-center text-white-50">
                    <i class="bi bi-image" style="font-size:3rem;"></i>
                </div>

                <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-semibold text-truncate mb-1"
                        th:text="${ual.anime.animeAdi}"
                        th:title="${ual.anime.animeAdi}">İsim</h6>

                    <div class="small text-muted mb-2">
                        <span th:if="${ual.anime.yayinYili != null}" th:text="${ual.anime.yayinYili}">2024</span>
                        <span th:if="${ual.anime.yayinYili != null and ual.anime.studyo != null}"> · </span>
                        <span th:if="${ual.anime.studyo != null}" th:text="${ual.anime.studyo}">Stüdyo</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge text-white badge-durum"
                              th:classappend="'durum-' + ${ual.izlemeDurumu.name()}"
                              th:text="${ual.izlemeDurumu.etiket}">Status</span>

                        <span th:if="${ual.puan != null}" class="text-warning small fw-medium">
                            <i class="bi bi-star-fill"></i>
                            <span th:text="${ual.puan} + '/10'">8/10</span>
                        </span>
                    </div>

                    <div class="mt-auto d-flex gap-1">
                        <a th:href="@{/anime/duzenle/{id}(id=${ual.id})}"
                           class="btn btn-sm btn-outline-primary flex-fill" title="Düzenle">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/anime/sil/{id}(id=${ual.id})}" method="post" 
                              class="flex-fill m-0"
                              onsubmit="return confirm('Bu kaydı listenizden silmek istediğinize emin misiniz?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100" title="Sil">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleSortDirection() {
        const yonInput = document.getElementById('sortYon');
        if(yonInput.value === 'asc') {
            yonInput.value = 'desc';
        } else {
            yonInput.value = 'asc';
        }
        document.getElementById('sortForm').submit();
    }
</script>
</body>
</html>
