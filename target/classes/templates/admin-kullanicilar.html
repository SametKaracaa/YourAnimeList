<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Yönetimi - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .navbar-admin {
            background: linear-gradient(135deg, rgba(127,29,29,0.95) 0%, rgba(153,27,27,0.9) 100%) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .user-table {
            border-radius: 16px;
            overflow: hidden;
        }
        .user-table thead th {
            background: #1e293b;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            font-weight: 700;
            border: none;
            padding: 1rem;
        }
        .user-table tbody td {
            padding: 0.875rem 1rem;
            vertical-align: middle;
        }
        .user-table tbody tr {
            transition: background .15s ease;
        }
        .user-table tbody tr:hover {
            background: rgba(99,102,241,0.04);
        }
        .badge-role-admin {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
        }
        .badge-role-user {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-admin navbar-dark sticky-top">
    <div class="container py-2">
        <a class="navbar-brand fw-bold" th:href="@{/admin/panel}">🛡️ Admin Panel</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/kullanicilar}" class="text-white text-decoration-none small fw-medium">
                <i class="bi bi-people me-1"></i>Kullanıcılar
            </a>
            <a th:href="@{/admin/animeler}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-collection-play me-1"></i>Animeler
            </a>
            <a th:href="@{/anime/ekle}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-plus-circle me-1"></i>Yeni Anime
            </a>
            <span class="text-white-50 small">|</span>
            <a th:href="@{/anime/liste}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Kullanıcı Paneli
            </a>
            <form th:action="@{/cikis}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right"></i> Çıkış
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div th:if="${basariMesaji}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${basariMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${hataMesaji}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${hataMesaji}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-white mb-1">
                <i class="bi bi-people-fill me-2"></i>Kullanıcı Yönetimi
            </h4>
            <p class="text-white-50 small mb-0">
                Sistemdeki tüm kullanıcılar aşağıda listelenmiştir.
                <span class="badge bg-secondary ms-1" th:text="${#lists.size(kullanicilar)}">0</span> kayıt
            </p>
        </div>
        <a th:href="@{/admin/panel}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Panele Dön
        </a>
    </div>
    <div class="card glass-panel border-0">
        <div class="table-responsive">
            <table class="table table-hover user-table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Kullanıcı Adı</th>
                        <th>E-posta</th>
                        <th>Rol</th>
                        <th class="text-center">İşlemler</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${kullanicilar}">
                        <td>
                            <span class="fw-medium text-muted" th:text="${u.id}">#</span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center"
                                     style="width:36px;height:36px;font-size:.85rem;">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <span class="fw-semibold" th:text="${u.kullaniciAdi}">user</span>
                            </div>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${u.email}">email</span>
                        </td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${u.rol == 'ROLE_ADMIN'} ? 'badge-role-admin' : 'badge-role-user'"
                                  th:text="${u.rol == 'ROLE_ADMIN'} ? 'Admin' : 'Kullanıcı'">Rol</span>
                        </td>
                        <td class="text-center">
                            <div th:if="${u.kullaniciAdi == 'admin'}" class="text-muted small fst-italic">
                                <i class="bi bi-shield-lock me-1"></i>Sistem Yöneticisi
                            </div>
                            <div th:if="${u.kullaniciAdi != 'admin'}" class="d-flex gap-1 justify-content-center">
                                <form th:action="@{/admin/kullanici/rol/{id}(id=${u.id})}" method="post" class="m-0"
                                      onsubmit="return confirm('Bu kullanıcının rolünü değiştirmek istediğinize emin misiniz?');">
                                    <button type="submit" class="btn btn-sm btn-outline-warning" title="Rol Değiştir">
                                        <i class="bi bi-arrow-repeat"></i>
                                    </button>
                                </form>
                                <form th:action="@{/admin/kullanici/sil/{id}(id=${u.id})}" method="post" class="m-0"
                                      onsubmit="return confirm('Bu kullanıcıyı ve tüm anime listesini silmek istediğinize emin misiniz? Bu işlem geri alınamaz!');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Sil">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
