<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Anime Listem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center" style="padding-top: 8vh;">
        <div class="col-md-5 col-lg-4">

            <div class="card glass-panel shadow-lg">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="display-5 mb-2">🎌</div>
                        <h2 class="fw-bold mb-1">Anime Listem</h2>
                        <p class="text-muted small mb-0">Hesabınıza giriş yapın</p>
                    </div>

                    <div th:if="${param.hata}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span>Kullanıcı adı veya şifre hatalı.</span>
                    </div>

                    <div th:if="${param.cikis}" class="alert alert-info d-flex align-items-center" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span>Başarıyla çıkış yaptınız.</span>
                    </div>

                    <div th:if="${basariMesaji}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${basariMesaji}"></span>
                    </div>

                    <form th:action="@{/giris-yap}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="kullaniciAdi" class="form-label fw-medium">Kullanıcı Adı</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="kullaniciAdi"
                                       name="kullaniciAdi" placeholder="kullanıcı adınız" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="sifre" class="form-label fw-medium">Şifre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="sifre"
                                       name="sifre" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
                        </button>
                    </form>

                    <div class="text-center small">
                        <span class="text-muted">Hesabınız yok mu?</span>
                        <a th:href="@{/kayit}" class="text-decoration-none fw-medium">Kayıt Ol</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
